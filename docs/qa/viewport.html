<!doctype html><html lang="it"><meta charset="utf-8"><title>PB-CARe — Verifica viewport</title><style>body{margin:0;background:#d6dbdb;color:#132c30;font:12px system-ui}header{position:sticky;top:0;z-index:2;background:#f5f5ec;padding:12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}button,select{padding:9px;font:inherit}#wrap{margin:15px;transform-origin:top left;width:var(--w);height:var(--h);transform:scale(var(--s))}iframe{display:block;width:100%;height:100%;border:0;background:#071a21}pre{white-space:pre-wrap;margin:15px;font:11px/1.5 monospace}#space{position:relative;overflow:hidden}</style>
<header><label>Viewport <select id="size"><option>1920×1080</option><option>1536×864</option><option>1440×900</option><option selected>1366×768</option><option>430×932</option><option>390×844</option></select></label><label>Sezione <select id="scene"><option value="">Hero</option><option value="pbcare">PB-CARe</option><option value="per-chi">Ingressi</option><option value="sep:0">Separazione: titolo</option><option value="sep:0.6">Separazione: confine</option><option value="sep:0.8">Separazione: token</option><option value="sep:1">Separazione: conclusione</option><option value="tempo">Tempo e welfare</option><option value="careprogram">CareProgram</option><option value="knowledge:0.55">FarmaCOmm</option><option value="camit">CAMIT</option><option value="eventi">EventiScientifici</option><option value="research:0.5">Enzima</option><option value="tutela">Articolo 32</option><option value="prosperya">Prosperya</option><option value="principi">Principi</option><option value="end">Contatti</option></select></label><label><input id="reduce" type="checkbox"> Movimento ridotto</label><button id="apply">Mostra</button><button id="measure">Misura DOM</button><a href="../../index.html">Apri sito</a><span id="status"></span></header><div id="space"><div id="wrap"><iframe title="PB-CARe alla viewport selezionata" src="../../index.html"></iframe></div></div><pre id="report"></pre>
<script>const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),space=document.querySelector('#space');function apply(){const [w,h]=document.querySelector('#size').value.split('×').map(Number);const s=Math.min(1,(innerWidth-30)/w,(innerHeight-95)/h);wrap.style.setProperty('--w',w+'px');wrap.style.setProperty('--h',h+'px');wrap.style.setProperty('--s',s);space.style.height=(h*s+30)+'px';const v=document.querySelector('#scene').value;const q=new URLSearchParams();if(document.querySelector('#reduce').checked)q.set('motion','reduce');if(v.includes(':'))q.set('snap',v);frame.src='../../index.html'+(q.toString()?'?'+q:'')+(v&&!v.includes(':')?'#'+v:'');document.querySelector('#status').textContent=w+'×'+h+' · scala '+s.toFixed(3);document.querySelector('#report').textContent='';}document.querySelector('#apply').onclick=apply;document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,win=frame.contentWindow;const r={viewport:[win.innerWidth,win.innerHeight],height:d.documentElement.scrollHeight,scrollY:win.scrollY,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,h1:d.querySelectorAll('h1').length,failedImages:[...d.images].filter(e=>e.complete&&!e.naturalWidth).map(e=>e.getAttribute('src')),lazyImagesPending:[...d.images].filter(e=>!e.complete).map(e=>e.getAttribute('src')),missingAnchors:[...d.querySelectorAll('a[href^="#"]')].filter(a=>!d.getElementById(a.hash.slice(1))).map(a=>a.hash),motion:d.body.classList.contains('reduced-motion')?'reduce':'full',sections:[...d.querySelectorAll('main>section')].map(e=>({id:e.id,height:Math.round(e.getBoundingClientRect().height)}))};document.querySelector('#report').textContent=JSON.stringify(r,null,2);};apply();</script></html>
